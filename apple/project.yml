# The Correspondent apps for iPhone, iPad and Mac. Generate the Xcode
# project with `xcodegen` (make -C apple project); the .xcodeproj is not
# kept in git.
name: Correspondent
options:
  bundleIdPrefix: org.arenzana
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 76L847LW9X
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
packages:
  CorrespondentKit:
    path: Kit
targets:
  Correspondent:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: CorrespondentKit
    info:
      path: App/Info.plist
      properties:
        # Servers on the local network (a home server, a test one) may use
        # plain HTTP; everything else needs HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Read-aloud keeps playing with the screen locked.
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arenzana.correspondent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Byline AppIcon-Morse
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=macosx*]": ""
        PRODUCT_NAME: Correspondent
        INFOPLIST_KEY_CFBundleDisplayName: Correspondent
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
