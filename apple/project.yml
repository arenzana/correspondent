# The Correspondent apps for iPhone, iPad and Mac. Generate the Xcode
# project with `xcodegen` (make -C apple project); the .xcodeproj is not
# kept in git.
name: Correspondent
options:
  bundleIdPrefix: org.arenzana
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 76L847LW9X
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
packages:
  CorrespondentKit:
    path: Kit
targets:
  Correspondent:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: CorrespondentKit
      - target: Share
        destinationFilters: [iOS]
      - target: Widgets
        destinationFilters: [iOS]
    entitlements:
      path: App/Correspondent.entitlements
      properties:
        com.apple.security.application-groups: [group.org.arenzana.correspondent]
        keychain-access-groups: ["$(AppIdentifierPrefix)org.arenzana.correspondent.shared"]
        # Notifications through APNs; release builds switch to production when exported.
        aps-environment: development
        com.apple.developer.aps-environment: development
    info:
      path: App/Info.plist
      properties:
        # Servers on the local network (a home server, a test one) may use
        # plain HTTP; everything else needs HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Widgets open the app at an article: correspondent://entry/ID.
        CFBundleURLTypes:
          - CFBundleURLName: org.arenzana.correspondent
            CFBundleURLSchemes: [correspondent]
        # Send to Obsidian asks whether it's installed before opening it.
        LSApplicationQueriesSchemes: [obsidian]
        # Read-aloud keeps playing with the screen locked.
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [org.arenzana.correspondent.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arenzana.correspondent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Byline AppIcon-Morse
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=macosx*]": ""
        PRODUCT_NAME: Correspondent
        INFOPLIST_KEY_CFBundleDisplayName: Correspondent
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Read and write: importing and exporting OPML.
        ENABLE_USER_SELECTED_FILES: readwrite
        # The Sun theme's rough position, asked for when it's chosen.
        ENABLE_RESOURCE_ACCESS_LOCATION: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: The Sun theme uses your rough location, to the nearest 11 km, to know when the sun sets where you are.
        INFOPLIST_KEY_NSLocationUsageDescription: The Sun theme uses your rough location, to the nearest 11 km, to know when the sun sets where you are.
  Share:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Share/Sources
      - path: App/Sources/Theme.swift
      - path: App/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: CorrespondentKit
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.org.arenzana.correspondent]
        keychain-access-groups: ["$(AppIdentifierPrefix)org.arenzana.correspondent.shared"]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Correspondent
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arenzana.correspondent.share
        PRODUCT_NAME: Share
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Correspondent
        SKIP_INSTALL: YES
  Widgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets/Sources
      - path: App/Sources/Theme.swift
      - path: App/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: CorrespondentKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.org.arenzana.correspondent]
        keychain-access-groups: ["$(AppIdentifierPrefix)org.arenzana.correspondent.shared"]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Correspondent
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arenzana.correspondent.widgets
        PRODUCT_NAME: Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
