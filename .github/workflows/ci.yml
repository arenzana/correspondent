name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run build
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: Fuzz (short)
        run: |
          go test ./internal/content -run='^$' -fuzz=FuzzProcess -fuzztime=30s
          go test ./internal/feed -run='^$' -fuzz=FuzzParse -fuzztime=30s
      - name: FreshRSS migration rehearsal
        run: |
          CGO_ENABLED=0 go build -o bin/correspondent ./cmd/correspondent
          test/migration/rehearse.sh
      - name: PWA offline end to end (Chrome)
        run: cd ui && node scripts/e2e-offline.mjs
      - name: Vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          cd ui && node scripts/audit.mjs
